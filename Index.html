<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASDIRU</title>
<meta name="color-scheme" content="light dark">
<script>
(function(){var t=null;try{t=localStorage.getItem('asdiru_tema')}catch(e){}
if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}
document.documentElement.setAttribute('data-theme',t)})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16224A; --muted:#5D6A91; --brand:#0A5BD8; --brand-d:#0B3F9E; --brand-l:#E6F0FF; --cyan:#00A8F0;
  --accent:#F59E0B; --paper:#F2F6FF; --page:#D9E4FB; --surface:#FFFFFF; --line:#E1E8F7;
  --ok:#1F9D6F; --warn:#C98A0B; --info:#2F7BE0; --bad:#D6453D;
  --ok-l:#E0F5EC; --warn-l:#FDF1D6; --info-l:#E3EEFF; --bad-l:#FCE6E3;
  --shadow:0 2px 14px rgba(25,70,170,.07);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:linear-gradient(160deg,#DCE6FC,#D3E3FB);background-attachment:fixed;font-size:15px;line-height:1.55}
[hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800} h2{font-size:18px;font-weight:700} h3{font-size:15px;font-weight:700}
p{margin:0}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)} .small{font-size:13px} .sr{position:absolute;left:-9999px}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:min(980px,100%);display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:32px;box-shadow:0 24px 70px rgba(25,70,170,.18);overflow:hidden;min-height:560px}
.login-art{background:linear-gradient(160deg,#D3E6FF,#9EC3F7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:36px;text-align:center}
.login-art img{width:min(300px,70%);height:auto;filter:drop-shadow(0 14px 22px rgba(10,70,170,.18))}
/* logo beranimasi: muncul membesar, melayang pelan, aura bernapas, cincin menyebar, dan kilau kecil berputar */
.logo-anim{position:relative;display:grid;place-items:center;width:min(330px,80%);aspect-ratio:1/1;cursor:pointer;-webkit-tap-highlight-color:transparent}
.logo-anim img{position:relative;z-index:2;width:88%;filter:drop-shadow(0 10px 12px rgba(10,60,160,.32)) drop-shadow(0 0 2px rgba(255,255,255,.9));animation:lgIn .9s cubic-bezier(.2,.9,.3,1.25) both,lgFloat 5.5s ease-in-out .9s infinite;transform-origin:50% 70%}
.lg-aura{position:absolute;inset:-8%;border-radius:50%;background:radial-gradient(circle,#fff 0%,rgba(255,255,255,.97) 34%,rgba(255,255,255,.8) 50%,rgba(255,255,255,.4) 64%,rgba(255,255,255,0) 78%);filter:blur(3px);animation:lgAura 4s ease-in-out infinite;z-index:1}
.lg-shadow{position:absolute;left:22%;right:22%;bottom:1%;height:7%;border-radius:50%;background:radial-gradient(ellipse,rgba(10,50,150,.35),rgba(10,50,150,0) 70%);z-index:1;animation:lgShadow 5.5s ease-in-out .9s infinite}
.lg-stars{position:absolute;inset:-4%;z-index:3;pointer-events:none}
.lg-stars b{position:absolute;display:block;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);filter:drop-shadow(0 0 2px rgba(10,91,216,.6)) drop-shadow(0 0 6px rgba(255,255,255,.95));opacity:0;animation:lgStar 2.6s ease-in-out infinite}
.lg-stars b:nth-child(1){left:8%;top:30%;width:37.0px;height:37.0px;animation-delay:0s;animation-duration:2.7s}
.lg-stars b:nth-child(2){left:18%;top:10%;width:23.8px;height:23.8px;animation-delay:0.7s;animation-duration:3.2s;background:#CFEAFF}
.lg-stars b:nth-child(3){left:30%;top:4%;width:31.7px;height:31.7px;animation-delay:1.4s;animation-duration:2.2s}
.lg-stars b:nth-child(4){left:62%;top:6%;width:26.4px;height:26.4px;animation-delay:0.3s;animation-duration:2.7s;background:#FFD27A}
.lg-stars b:nth-child(5){left:80%;top:14%;width:39.6px;height:39.6px;animation-delay:1.1s;animation-duration:3.2s}
.lg-stars b:nth-child(6){left:92%;top:32%;width:23.8px;height:23.8px;animation-delay:1.9s;animation-duration:2.2s;background:#CFEAFF}
.lg-stars b:nth-child(7){left:6%;top:58%;width:26.4px;height:26.4px;animation-delay:0.9s;animation-duration:2.7s}
.lg-stars b:nth-child(8){left:14%;top:80%;width:34.3px;height:34.3px;animation-delay:1.6s;animation-duration:3.2s;background:#FFD27A}
.lg-stars b:nth-child(9){left:88%;top:60%;width:31.7px;height:31.7px;animation-delay:0.5s;animation-duration:2.2s}
.lg-stars b:nth-child(10){left:80%;top:86%;width:23.8px;height:23.8px;animation-delay:2.2s;animation-duration:2.7s;background:#CFEAFF}
.lg-stars b:nth-child(11){left:50%;top:0%;width:21.1px;height:21.1px;animation-delay:1.2s;animation-duration:3.2s}
.lg-stars b:nth-child(12){left:94%;top:8%;width:21.1px;height:21.1px;animation-delay:2.5s;animation-duration:2.2s;background:#FFD27A}
@keyframes lgStar{0%,100%{opacity:0;transform:scale(.2) rotate(0)}45%,55%{opacity:1;transform:scale(1) rotate(45deg)}}
[data-theme=dark] .lg-stars b{filter:drop-shadow(0 0 5px rgba(255,255,255,.9))}
@keyframes lgShadow{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.78);opacity:.5}}
.lg-ring{position:absolute;inset:14%;border-radius:50%;border:2px solid rgba(10,91,216,.35);animation:lgRing 4s ease-out infinite;z-index:1}
.lg-sp{position:absolute;z-index:3;width:10px;height:10px;background:#22c8e8;border-radius:2px;transform:rotate(45deg);opacity:0;animation:lgSp 3.2s ease-in-out infinite}
.lg-sp.s1{top:12%;left:16%;animation-delay:1.1s}.lg-sp.s2{top:24%;right:10%;width:7px;height:7px;background:#ffb020;animation-delay:1.9s}
.lg-sp.s3{bottom:22%;left:8%;width:8px;height:8px;background:#0A5BD8;animation-delay:2.6s}.lg-sp.s4{bottom:14%;right:18%;width:9.9px;height:9.9px;animation-delay:3.3s}
.logo-anim.hi img{animation:lgIn .9s cubic-bezier(.2,.9,.3,1.25) both,lgWave 1s ease-in-out,lgFloat 5.5s ease-in-out 1s infinite}
@keyframes lgIn{from{opacity:0;transform:translateY(18px) scale(.82)}to{opacity:1;transform:none}}
@keyframes lgFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(.8deg)}}
@keyframes lgWave{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg) scale(1.04)}45%{transform:rotate(3deg) scale(1.04)}70%{transform:rotate(-2deg)}}
@keyframes lgAura{0%,100%{opacity:.7;transform:scale(.94)}50%{opacity:1;transform:scale(1.1)}}
@keyframes lgRing{0%{opacity:.7;transform:scale(.7)}100%{opacity:0;transform:scale(1.25)}}
@keyframes lgSp{0%,100%{opacity:0;transform:rotate(45deg) scale(.3)}40%,60%{opacity:1;transform:rotate(225deg) scale(1)}}
.login-art p{color:var(--brand-d);font-weight:600;max-width:21em;position:relative;z-index:4}
/* efek mengetik: teks lengkap tak terlihat menjaga tinggi blok agar tidak melompat */
.tw{position:relative}
.tw-ghost{visibility:hidden}
.tw-live{position:absolute;left:0;right:0;top:0}
.tw-live::after{content:"";display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-.15em;background:var(--brand);animation:twBlink 1s steps(1) infinite}
@keyframes twBlink{50%{opacity:0}}
.login-form{display:flex;align-items:center;justify-content:center;padding:36px 32px}
.login-form form{width:100%;max-width:340px;display:grid;gap:16px}

/* ---------- form ---------- */
.field{display:grid;gap:6px}
.field label,.lbl{font-size:13px;font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],select,textarea{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);min-height:44px}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 4px rgba(10,91,216,.14)}
select:disabled,input:disabled{background:var(--paper);color:var(--muted)}
.pw{position:relative} .pw button{position:absolute;right:6px;top:6px;border:0;background:none;color:var(--muted);padding:6px 8px;cursor:pointer;font-size:13px;font-weight:600;display:grid;place-items:center;border-radius:10px}
.pw button svg{width:22px;height:22px} .pw button:hover,.pw button[aria-pressed=true]{color:var(--brand)}
.pw input{padding-right:48px}
.pw.ico-in input{padding-left:44px}
.ico-in{position:relative} .ico-in input{padding-left:44px} .ico-in .ico-l{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.ico-in:focus-within .ico-l{color:var(--brand)}
.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.hint{font-size:12.5px;color:var(--muted)}
.err{background:var(--bad-l);color:#8E2A22;border-radius:12px;padding:10px 14px;font-size:14px}

/* ---------- tombol ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:10px 20px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#1677F2,#0A4FCB);color:#fff;min-height:44px;position:relative;text-decoration:none;box-shadow:0 6px 16px rgba(10,91,216,.25)}
.btn:hover{background:linear-gradient(135deg,#0F6BE6,#0B3F9E)}
.btn.ghost{background:var(--surface);color:var(--brand);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--brand-l)}
.btn.warn{background:linear-gradient(135deg,#FFB332,#F59E0B);color:#3a2300;box-shadow:0 6px 16px rgba(245,158,11,.28)}
.btn.sm{padding:6px 14px;min-height:36px;font-size:13px;box-shadow:none}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.busy::after{content:"";width:15px;height:15px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- kerangka ---------- */
.app{padding:28px}
.frame{display:grid;grid-template-columns:104px minmax(0,1fr);background:var(--paper);border-radius:34px;box-shadow:0 24px 70px rgba(25,70,170,.16);border:1px solid rgba(255,255,255,.8);min-height:calc(100vh - 56px)}
.side{margin:20px 0 20px 20px;width:84px;position:sticky;top:48px;align-self:start;height:calc(100vh - 96px);min-height:420px;border-radius:42px;background:linear-gradient(180deg,#2A86FF 0%,#0A5BD8 55%,#0B3F9E 100%);display:flex;flex-direction:column;align-items:center;padding:18px 0 20px;box-shadow:0 14px 30px rgba(10,70,190,.3)}
.side-logo{width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;margin-bottom:22px;flex:none}
.side-logo img{width:42px;height:auto}
.nav{display:grid;gap:10px;justify-items:center}
.side button{position:relative;width:48px;height:48px;border:0;border-radius:15px;background:none;color:rgba(255,255,255,.85);display:grid;place-items:center;cursor:pointer}
.side button svg{width:24px;height:24px}
.side button:hover{background:rgba(255,255,255,.16);color:#fff}
.side .nav button[aria-current=page]{background:#fff;color:var(--brand);box-shadow:0 6px 14px rgba(0,30,110,.25)}
.side .out{margin-top:auto}
.side .theme-btn ~ .out{margin-top:10px}
.side [data-tip]::after{content:attr(data-tip);position:absolute;left:calc(100% + 14px);top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;padding:5px 11px;border-radius:9px;font-size:12.5px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:40}
.side [data-tip]:hover::after,.side [data-tip]:focus-visible::after{opacity:1}
.content{min-width:0}
.topbar{display:none}
.main{padding:30px clamp(16px,3vw,36px) 48px;max-width:1240px}
.page-head{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:center;margin-bottom:22px}
.page-head p{margin-top:2px}
.head-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.chip-user{display:flex;align-items:center;gap:10px}
.chip-user b{display:block;font-size:13.5px;line-height:1.2} .chip-user div span{font-size:12px;color:var(--muted)}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#00A8F0,#0A5BD8);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--brand-l);color:var(--brand-d);font-weight:700;font-size:13px}
.badge.ok{background:var(--ok-l);color:#14744F} .badge.warn{background:var(--warn-l);color:#80560a} .badge.bad{background:var(--bad-l);color:#8E2A22} .badge.info{background:var(--info-l);color:#1F55A8}
.card{background:var(--surface);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.card + .card{margin-top:18px}
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.grid2 .card + .card,.row .card + .card{margin-top:0}
.stack{display:grid;gap:18px}
.tabs{display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;padding:5px;background:var(--surface);border-radius:16px;width:fit-content;max-width:100%;box-shadow:var(--shadow)}
.tabs button{border:0;background:none;padding:9px 18px;font-weight:700;color:var(--muted);cursor:pointer;border-radius:12px;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--brand);color:#fff}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* ---------- beranda ---------- */
.home{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.banner{position:relative;background:linear-gradient(110deg,#0A4FCB 0%,#1677F2 58%,#00A8F0 100%);border-radius:24px;color:#fff;padding:28px 28px 28px 178px;min-height:136px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 14px 30px rgba(10,91,216,.28);overflow:hidden}
.banner h2{font-size:clamp(20px,2.4vw,26px);font-weight:800}
.banner p{opacity:.9;margin-top:4px}
.banner .art{position:absolute;left:24px;top:50%;transform:translateY(-50%);width:132px;height:132px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,30,120,.3)}
.banner .art img{width:104px;height:auto}
.banner::after{content:"";position:absolute;right:26px;bottom:-30px;width:92px;height:92px;border-radius:50%;border:16px solid rgba(255,255,255,.18);border-left-color:transparent;border-bottom-color:transparent;transform:rotate(25deg)}
.sec-title{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px}
.tile{background:var(--surface);border-radius:20px;padding:18px 12px 16px;text-align:center;box-shadow:var(--shadow)}
.tile .l{font-size:13px;color:var(--muted);margin-bottom:2px}
.tile .n{font-size:24px;font-weight:800;line-height:1.1}
.ico{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;margin:0 auto 10px;color:#fff}
.ico svg{width:24px;height:24px}
.i-blue{background:linear-gradient(135deg,#3A8BFF,#0A5BD8)} .i-cyan{background:linear-gradient(135deg,#4AD0FF,#00A8F0)} .i-amber{background:linear-gradient(135deg,#FFC24D,#F59E0B)} .i-rose{background:linear-gradient(135deg,#FF8A7A,#E4503F)}
.tile.add{border:2px dashed var(--brand);background:transparent;box-shadow:none;display:grid;place-items:center;color:var(--brand);cursor:pointer;font-weight:700;gap:4px;min-height:132px}
.tile.add svg{width:30px;height:30px}
.rightcol{display:grid;gap:18px}
.profile{text-align:center}
.ring{width:96px;height:96px;border-radius:50%;margin:4px auto 12px;padding:5px;background:conic-gradient(#0A5BD8,#00A8F0,#F59E0B,#0A5BD8)}
.ring .av{width:100%;height:100%;font-size:28px;border:4px solid #fff}
.profile h3{font-size:17px}
.mini-list{display:grid;gap:12px}
.mini{display:flex;gap:12px;align-items:flex-start}
.mini .av{width:36px;height:36px;font-size:13px;background:linear-gradient(135deg,#FFC24D,#F59E0B)}
.mini b{display:block;font-size:14px;line-height:1.3} .mini div span{font-size:12.5px;color:var(--muted)}
.gradcard{background:linear-gradient(150deg,#1677F2,#0B3F9E);color:#fff;box-shadow:0 14px 30px rgba(10,91,216,.25)}
.gradcard h2,.gradcard h3{color:#fff}
.gradcard .big{font-size:44px;font-weight:800;line-height:1;margin:6px 0 12px}
.gbar{display:grid;grid-template-columns:44px 1fr 28px;gap:8px;align-items:center;font-size:13px;margin-top:7px}
.gbar i{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.gbar i s{display:block;height:100%;background:var(--surface);border-radius:4px;text-decoration:none}

/* ---------- jadwal ---------- */
.sched{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.slot{--sc:var(--brand);display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);position:relative;overflow:hidden}
.slot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--sc)}
.slot:nth-child(4n+2){--sc:var(--cyan)} .slot:nth-child(4n+3){--sc:var(--accent)} .slot:nth-child(4n+4){--sc:#E4503F}
.slot .time{font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3}
.slot .time small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.slot .mapel{font-weight:700}
.slot .meta{font-size:13px;color:var(--muted)}
.slot.ongoing{background:linear-gradient(110deg,#0A4FCB,#1677F2);color:#fff;box-shadow:0 10px 22px rgba(10,91,216,.3)}
.slot.ongoing .time small,.slot.ongoing .meta{color:rgba(255,255,255,.85)}
.slot.ongoing::before{background:var(--accent)}
.slot.done{opacity:.5}
.slot.next .time{color:var(--brand)}

/* ---------- presensi ---------- */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted);margin-bottom:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.c-H{--c:var(--ok);--cl:var(--ok-l)} .c-S{--c:var(--warn);--cl:var(--warn-l)} .c-I{--c:var(--info);--cl:var(--info-l)} .c-A{--c:var(--bad);--cl:var(--bad-l)}
.dot.c-H{background:var(--ok)} .dot.c-S{background:var(--warn)} .dot.c-I{background:var(--info)} .dot.c-A{background:var(--bad)}
.stu-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stu{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.stu:last-child{border-bottom:0}
.stu .no{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.stu.miss{background:var(--warn-l)}
.seg{display:flex;gap:6px}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0}
.seg span{display:grid;place-items:center;width:42px;height:38px;border-radius:12px;border:1.5px solid var(--line);font-weight:800;background:var(--surface);color:var(--muted)}
.seg input:checked + span{background:var(--c);border-color:var(--c);color:#fff}
.seg input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.tally{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.tally span{padding:4px 12px;border-radius:999px;background:var(--cl,var(--paper));color:var(--c,var(--muted));font-weight:700;font-size:13px}
.savebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}
.tbl-wrap{overflow-x:auto;border-radius:16px;box-shadow:var(--shadow)}
table.tbl{border-collapse:collapse;width:100%;font-size:14px;background:var(--surface)}
.tbl th{background:var(--brand);color:#fff;text-align:left;padding:11px 12px;font-weight:700;white-space:nowrap}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl td.n,.tbl th.n{text-align:center;font-variant-numeric:tabular-nums}
.tbl tr.total td{background:var(--brand-l);font-weight:800}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:420px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px 12px}
.bub{max-width:min(720px,92%);padding:12px 16px;border-radius:18px;line-height:1.6}
.bub.user{align-self:flex-end;background:linear-gradient(135deg,#1677F2,#0A4FCB);color:#fff;border-bottom-right-radius:5px;white-space:pre-wrap}
.bub.model{align-self:flex-start;background:var(--paper);border-bottom-left-radius:5px}
.bub.model p+p,.bub.model ul+p,.bub.model p+ul{margin-top:8px}
.bub.model ul,.bub.model ol{margin:6px 0;padding-left:22px}
.bub.model pre{background:var(--surface);padding:10px;border-radius:10px;overflow-x:auto;font-size:13px}
.bub.model code{background:var(--surface);padding:1px 5px;border-radius:5px;font-size:.92em}
.bub.model h3,.bub.model h4{margin:10px 0 4px}
.bub .copy{margin-top:8px}
.composer{display:flex;gap:10px;align-items:flex-end;border-top:1px solid var(--line);padding-top:12px}
.composer textarea{min-height:46px;max-height:160px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--brand-d)}
.chips button:hover{background:var(--brand-l)}
.typing{align-self:flex-start;color:var(--muted);font-size:14px}

/* ---------- widget asisten melayang ---------- */
.cw{position:fixed;right:24px;bottom:24px;z-index:60}
.cw-fabwrap{position:relative;width:62px;height:62px;margin-left:auto}
.cw:not(.open) .cw-fabwrap{animation:cwFloat 3.4s ease-in-out infinite}
.cw-fabwrap:hover{animation-play-state:paused}
.cw-ring{position:absolute;inset:0;border-radius:50%;background:rgba(22,119,242,.5);animation:cwPulse 2.6s ease-out infinite;pointer-events:none}
.cw.open .cw-ring{display:none}
.cw-fab{position:relative;width:62px;height:62px;border-radius:50%;border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,#1677F2,#0A4FCB);box-shadow:0 12px 28px rgba(10,79,203,.4);display:grid;place-items:center;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s;animation:cwPop .65s .4s cubic-bezier(.34,1.56,.64,1) backwards}
.cw-fab:hover{transform:translateY(-3px) scale(1.07);box-shadow:0 16px 34px rgba(10,79,203,.5)}
.cw-fab:active{transform:scale(.93)}
.cw-fab svg{grid-area:1/1;width:28px;height:28px;transition:transform .38s cubic-bezier(.34,1.56,.64,1),opacity .2s}
.cw-fab .i-close{opacity:0;transform:rotate(-90deg) scale(.4)}
.cw.open .cw-fab .i-chat{opacity:0;transform:rotate(90deg) scale(.4)}
.cw.open .cw-fab .i-close{opacity:1;transform:none}
.cw-fab .i-chat{width:48px;height:48px}
.cw-fab .rb-ant{stroke:#fff}
.cw-fab .rb-cup{fill:#CFE4FF}
.cw-fab .rb-ball{animation:none;fill:#FFB020}
.cw-label{position:absolute;right:72px;bottom:14px;border:0;background:var(--surface);color:#EA580C;font:inherit;font-weight:800;font-size:13.5px;padding:8px 15px;border-radius:999px;box-shadow:0 8px 22px rgba(15,40,110,.18);white-space:nowrap;cursor:pointer;transition:opacity .25s,transform .35s cubic-bezier(.34,1.56,.64,1)}
.cw-label:hover{transform:translateX(-3px)}
.cw.open .cw-label{opacity:0;transform:translateX(10px);pointer-events:none}
.rb-eyes{transform-box:fill-box;transform-origin:center;animation:rbBlink 5s ease-in-out infinite}
.rb-ball{animation:rbBall 2s ease-in-out infinite}
.cw-hero{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0 4px;text-align:center}
.cw-hero svg{width:118px;height:auto;animation:cwFloat 3.6s ease-in-out infinite}
.cw-hero b{color:#EA580C;font-size:19px;font-weight:800;line-height:1.2}
.cw-hero span{color:var(--muted);font-size:12.5px}
@keyframes rbBlink{0%,92%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.1)}}
@keyframes rbBall{0%,100%{fill:#2D9CFF}50%{fill:#8BE6FF}}
.cw-dot{position:absolute;top:1px;right:1px;width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid #fff;animation:cwPop .4s cubic-bezier(.34,1.56,.64,1)}
.cw-dot[hidden]{display:none}
.cw-hint{position:absolute;right:0;bottom:80px;background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:16px 16px 4px 16px;box-shadow:0 10px 26px rgba(15,40,110,.18);font-weight:700;font-size:13.5px;white-space:nowrap;opacity:0;transform:translateY(10px) scale(.9);transform-origin:bottom right;pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.cw-hint.show{opacity:1;transform:none}
.cw-panel{position:absolute;right:0;bottom:78px;width:380px;height:min(580px,calc(100vh - 130px));display:flex;flex-direction:column;background:var(--surface);border-radius:24px;box-shadow:0 24px 60px rgba(15,40,110,.28),0 0 0 1px rgba(25,70,170,.08);overflow:hidden;transform-origin:calc(100% - 31px) 100%;opacity:0;visibility:hidden;transform:translateY(18px) scale(.82);transition:opacity .22s ease,transform .4s cubic-bezier(.34,1.4,.64,1),width .3s ease,height .3s ease,visibility 0s linear .4s}
.cw.open .cw-panel{opacity:1;visibility:visible;transform:none;transition:opacity .22s ease,transform .4s cubic-bezier(.34,1.4,.64,1),width .3s ease,height .3s ease,visibility 0s}
.cw.wide .cw-panel{width:min(560px,calc(100vw - 48px));height:min(720px,calc(100vh - 130px))}
.cw-head{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.cw-av{position:relative;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#E6F0FF,#CFE2FF);display:grid;place-items:center;flex:none}
.cw-av svg{width:38px;height:auto}
.cw-av::after{content:"";position:absolute;right:-1px;bottom:0;width:12px;height:12px;border-radius:50%;background:#2FCB85;border:2px solid #fff;animation:cwOnline 2.2s ease-in-out infinite}
.cw-head b{display:block;font-size:18px;line-height:1.2;font-weight:800;color:#EA580C}
.cw-head small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.cw-hb{margin-left:auto;display:flex;gap:2px}
.cw-ib{width:34px;height:34px;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:background .15s,color .15s,transform .2s}
.cw-ib:hover{background:var(--brand-l);color:var(--brand);transform:scale(1.08)}
.cw-ib svg{width:18px;height:18px}
.cw-msgs{flex:1;min-height:0;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px;background:var(--paper);scroll-behavior:smooth}
.cw-msgs .bub{max-width:88%;padding:10px 14px;font-size:14px;line-height:1.55;animation:cwIn .35s cubic-bezier(.34,1.3,.64,1) both}
.cw-msgs .bub.model{background:var(--surface);box-shadow:var(--shadow)}
.cw-msgs .bub.bad{align-self:flex-start;background:var(--bad-l);color:#8E2A22;border-bottom-left-radius:5px;font-size:13.5px}
.cw-msgs .bub .copy{margin-top:6px;min-height:0;padding:4px 10px;font-size:12px}
.cw-chips{display:flex;flex-direction:column;align-items:flex-start;gap:7px;margin-top:2px}
.cw-chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 13px;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:var(--brand-d);text-align:left;animation:cwIn .4s cubic-bezier(.34,1.3,.64,1) both;transition:background .15s,transform .15s,border-color .15s}
.cw-chips button:hover{background:var(--brand-l);border-color:var(--brand);transform:translateX(3px)}
.cw-typing{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-radius:18px;border-bottom-left-radius:5px;padding:13px 16px;display:flex;gap:5px;animation:cwIn .3s both}
.cw-typing i{width:7px;height:7px;border-radius:50%;background:var(--brand);opacity:.35;animation:cwDot 1.1s ease-in-out infinite}
.cw-typing i:nth-child(2){animation-delay:.15s} .cw-typing i:nth-child(3){animation-delay:.3s}
.cw-comp{display:flex;gap:8px;align-items:flex-end;padding:10px 12px 6px;background:var(--surface);border-top:1px solid var(--line);flex:none}
.cw-comp textarea{flex:1;min-height:42px;max-height:120px;resize:none;border-radius:16px;padding:10px 14px;line-height:1.4}
.cw-send{width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(135deg,#1677F2,#0A4FCB);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none;transition:transform .2s cubic-bezier(.34,1.56,.64,1),opacity .2s}
.cw-send:hover{transform:scale(1.1) rotate(-8deg)}
.cw-send:disabled{opacity:.45;cursor:default;transform:none}
.cw-send svg{width:20px;height:20px}
.cw-foot{text-align:center;font-size:11px;color:var(--muted);padding:0 12px 9px;background:var(--surface);flex:none}
@keyframes cwPulse{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(1.75);opacity:0}}
@keyframes cwFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes cwPop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes cwIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes cwDot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
@keyframes cwOnline{0%,100%{box-shadow:0 0 0 0 rgba(61,220,151,.6)}50%{box-shadow:0 0 0 5px rgba(61,220,151,0)}}
@media (max-width:900px){
  .cw{right:14px;bottom:92px}
  .cw-panel{position:fixed;inset:10px;width:auto;height:auto;border-radius:22px;transform-origin:bottom right}
  .cw.wide .cw-panel{width:auto;height:auto}
  .cw-hb .cw-wide{display:none}
  .cw-fabwrap{transition:opacity .2s,transform .3s}
  .cw.open .cw-fabwrap{opacity:0;pointer-events:none;transform:scale(.5)}
}
@media (prefers-reduced-motion:reduce){
  .cw *,.cw-panel{animation:none!important;transition-duration:.01s!important}
}

/* ---------- loading beranimasi ---------- */
.ld{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:460px;margin:26px auto;padding:30px 24px 24px;background:var(--surface);border-radius:26px;box-shadow:0 14px 40px rgba(25,70,170,.12);border:1px solid var(--line);animation:cwIn .4s cubic-bezier(.34,1.3,.64,1) both}
.ld-art{position:relative;width:104px;height:104px;display:grid;place-items:center;margin-bottom:14px}
.ld-art>svg{position:relative;z-index:1;width:64px;height:auto;animation:cwFloat 2.4s ease-in-out infinite}
.ld-ring{position:absolute;inset:0;border-radius:50%;border:3px dashed rgba(22,119,242,.35);animation:ldSpin 8s linear infinite}
.ld-ring.r2{inset:9px;border:3px solid transparent;border-top-color:#FF9F1C;border-right-color:#FF9F1C;animation:ldSpin 1.3s linear infinite}
.ld-spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#43E6FF;animation:ldTwinkle 1.8s ease-in-out infinite}
.ld-spark.s1{top:4px;right:10px}
.ld-spark.s2{bottom:8px;left:2px;background:#FFB020;animation-delay:.6s;width:6px;height:6px}
.ld-spark.s3{top:30px;left:-4px;background:#7C3AED;animation-delay:1.1s;width:5px;height:5px}
.ld-title{font-size:18px;font-weight:800;line-height:1.3}
.ld-msg{min-height:22px;margin-top:6px;color:var(--muted);font-size:14px;line-height:1.45;transition:opacity .22s,transform .22s}
.ld-msg.swap{opacity:0;transform:translateY(6px)}
.ld-bar{position:relative;width:100%;height:12px;margin-top:20px;border-radius:99px;background:#E6EEFB;overflow:hidden}
.ld-bar i{position:relative;display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#1677F2,#00B3F0);transition:width .25s ease-out,background .4s;overflow:hidden}
.ld-bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);animation:ldShine 1.3s linear infinite}
.ld-meta{display:flex;justify-content:space-between;align-items:baseline;width:100%;margin-top:8px;font-size:12.5px;color:var(--muted)}
.ld-meta b{font-size:16px;font-weight:800;color:#EA580C;font-variant-numeric:tabular-nums}
.ld-hint{margin-top:12px;font-size:12.5px;color:var(--muted)}
.ld.done .ld-bar i{background:linear-gradient(90deg,#2FCB85,#0E9F6E)}
.ld.done .ld-title{color:#0E9F6E}
.ld.done .ld-meta b{color:#0E9F6E}
.ld.done .ld-ring.r2{animation-play-state:paused;border-top-color:#2FCB85;border-right-color:#2FCB85}
.ld-c{flex-direction:row;flex-wrap:wrap;align-items:center;max-width:none;margin:0;padding:0;background:none;box-shadow:none;border:0;border-radius:0;text-align:left;animation:none}
.ld-c .ld-msg{flex:1 1 100%;min-height:18px;margin:0 0 5px;font-size:12.5px}
.ld-c .ld-bar{flex:1;width:auto;height:8px;margin:0}
.ld-c .ld-pct{margin-left:10px;font-size:13px;font-weight:800;color:#EA580C;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
@keyframes ldSpin{to{transform:rotate(360deg)}}
@keyframes ldShine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes ldTwinkle{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){.ld *{animation:none!important;transition-duration:.01s!important}}

/* ---------- data kurikulum ---------- */
.kdrop{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:14px;padding:22px 16px;border:2px dashed #9DBBF0;border-radius:18px;background:#F5F9FF;text-align:center;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.kdrop:hover,.kdrop.over{background:#EAF2FF;border-color:var(--brand);transform:translateY(-1px)}
.kdrop b{font-size:15px}
.kdrop-ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#3B9BFF,#0A5BD8);box-shadow:0 8px 16px rgba(10,91,216,.3);margin-bottom:4px}
.kdrop-ic svg{width:26px;height:26px}
.kchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kchip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:#F1F4FA;color:var(--muted);font-size:12.5px;font-weight:700}
.kchip.ok{background:#E3F8EE;color:#0E7A52}
.kchip.bad{background:var(--bad-l);color:#8E2A22}
.kstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:8px 0 12px}
.kstats div{background:var(--paper);border-radius:14px;padding:9px 12px}
.kstats b{display:block;font-size:20px;font-weight:800;line-height:1.1}
.kstats span{font-size:12px;color:var(--muted)}
.kstats .g b{color:#0E9F6E} .kstats .o b{color:#EA580C} .kstats .r b{color:#C0392B}
.kscroll{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:260px}
.ktbl{width:100%;border-collapse:collapse;font-size:13px}
.ktbl th{position:sticky;top:0;background:#F1F6FF;text-align:left;padding:8px 10px;font-size:12px;color:var(--muted)}
.ktbl td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
.kwarn{margin:8px 0;padding:10px 14px 10px 30px;background:#FFF7E6;border-radius:12px;color:#8A5300;font-size:13px}
.kwarn li{margin:2px 0}
.ksum summary{cursor:pointer;font-weight:700;color:var(--brand-d);margin-top:6px}
.kfile{font-size:13px;color:var(--muted);margin:10px 0 2px}

/* ---------- kop dokumen ---------- */
.kop-prev{margin:12px 0;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:center;box-shadow:inset 0 0 0 6px var(--paper)}
.kop-prev img{display:block;max-width:100%;height:auto;margin:0 auto}
.kop-prev.kosong{color:var(--muted);font-size:13.5px;padding:22px 16px}
.kop-chk{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer}
.kop-chk input{width:18px;height:18px}

/* ---------- cadangan AI ---------- */
.gbtns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.int-note{background:#FFF7E6;border:1px solid #FFD9A0;color:#8A5300;border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin:0 0 14px}
.int-note b{display:block;margin-bottom:2px}
.alt-chain{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0 18px;padding:0;list-style:none}
.alt-chain li{background:var(--paper);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.alt-chain b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px}

/* ---------- generator ---------- */
.mode{display:inline-flex;background:var(--surface);border-radius:14px;padding:4px;margin-bottom:18px;box-shadow:var(--shadow)}
.mode button{border:0;background:none;padding:8px 20px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer}
.mode button[aria-pressed=true]{background:var(--brand);color:#fff}
.cp-box{background:var(--paper);border-radius:14px;padding:12px 16px;font-size:14px}
.cp-box b{display:block;font-size:13px;margin-bottom:2px}
.mode.cak{margin-bottom:0;justify-self:start;box-shadow:none;border:1.5px solid var(--line)}
.mode.cak button{padding:7px 16px;font-size:13.5px}
.tp-cek{display:flex;flex-direction:column;gap:6px}
.tp-cek label{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:14px;cursor:pointer;line-height:1.4}
.tp-cek label:has(input:checked){border-color:var(--brand)}
.tp-cek input{accent-color:var(--brand);margin-top:3px;flex:none}
.soal-card{border:1.5px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.soal-card + .soal-card{margin-top:12px}
.soal-head{display:flex;justify-content:space-between;align-items:center}
.ed-field{display:grid;gap:6px}
.ed-field + .ed-field{margin-top:14px}

/* ---------- kepsek ---------- */
.ratio{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--paper);margin:10px 0}
.ratio i{display:block;height:100%;background:var(--c)}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px}
.facts div{font-size:14px}
.facts b{font-size:22px;font-weight:800;margin-right:5px;color:var(--c)}
.chart-box{position:relative;height:280px}
details.files summary{cursor:pointer;font-weight:700;color:var(--brand)}
details.files ul{margin:8px 0 0;padding-left:18px;font-size:13px}

/* ---------- widget jam & grafik (v2.5) ---------- */
.banner.has-clock{padding:12px 16px;min-height:0;display:block;overflow:visible}
.banner.has-clock h2{font-size:clamp(17px,2vw,21px);line-height:1.2}
.banner.has-clock p{margin-top:2px;font-size:13.5px;line-height:1.35}
.banner.has-clock p.quote{font-style:italic}
.banner.has-clock::after{display:none}
.bn-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;width:100%}
.bn-txt{flex:1 1 200px;min-width:0}
.dclock{flex:none;display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);border-radius:22px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 8px 20px rgba(0,30,120,.2)}
.dc-date{width:64px;border-radius:15px;background:#fff;overflow:hidden;text-align:center;flex:none;color:#0A4FCB;box-shadow:0 5px 12px rgba(0,30,120,.2)}
.dc-date .wk{display:block;background:linear-gradient(135deg,#FF9F1C,#EA580C);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:3px 0;line-height:1.2}
.dc-date .dd{display:block;font-size:30px;font-weight:800;line-height:1;margin:4px 0 1px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

  .side .nav{gap:clamp(4px,1.4vh,14px)}
}
@media (min-width:901px) and (max-height:620px){
  .side{padding:12px 0}
  .side-logo{width:42px;height:42px;margin-bottom:6px} .side-logo img{width:32px}
  .side button,.side .theme-btn{width:40px;height:40px;border-radius:12px}
  .side button svg,.side .theme-btn svg{width:23px;height:23px}
  .side .nav{gap:4px}
}
@media (min-width:901px) and (max-height:560px){
  .side{padding:10px 0}
  .side-logo{width:38px;height:38px;margin-bottom:4px} .side-logo img{width:28px}
  .side button,.side .theme-btn{width:36px;height:36px;border-radius:11px}
  .side button svg,.side .theme-btn svg{width:21px;height:21px}
  .side .nav{gap:2px} .side .out,.side .theme-btn ~ .out{margin-top:2px}
}

/* grafik kehadiran: donat komposisi + rincian */
.gk{display:grid;grid-template-columns:minmax(180px,240px) 1fr;gap:28px;align-items:center;margin-top:6px}
.gk .empty{grid-column:1/-1}
.gk-donut{position:relative;height:220px}
.gk-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.gk-center b{font-size:30px;font-weight:800;line-height:1;color:var(--ink)}
.gk-center span{font-size:12px;color:var(--muted);margin-top:4px}
.gk-list{display:grid;gap:12px}
.gk-row{display:grid;grid-template-columns:12px 1fr auto 58px;grid-template-rows:auto 6px;align-items:center;gap:4px 10px}
.gk-dot{width:12px;height:12px;border-radius:4px;background:var(--c)}
.gk-nm{font-weight:600;font-size:14px}
.gk-row b{font-size:18px;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums}
.gk-pc{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.gk-bar{grid-column:2/-1;height:6px;border-radius:99px;background:var(--paper);overflow:hidden;display:block}
.gk-bar s{display:block;height:100%;border-radius:inherit;background:var(--c);text-decoration:none;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.gk-tot{font-size:12.5px;color:var(--muted);margin-top:2px}
@media (max-width:640px){.gk{grid-template-columns:1fr;gap:18px}.gk-donut{height:200px;max-width:220px;margin:0 auto;width:100%}}

.jd-kls{padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-top:8px}
.jd-kls > b{margin-right:8px}
.jd-kls .kchip i{font-style:normal;font-weight:800;color:var(--brand);margin-left:2px}

/* level kognitif C1-C6 */
.lv-field{grid-column:1/-1}
.lv-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.lv-pick label{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 6px 8px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:center;transition:border-color .15s,background .15s,transform .15s}
.lv-pick label:hover{transform:translateY(-1px);border-color:var(--brand)}
.lv-pick input{position:absolute;opacity:0;pointer-events:none}
.lv-pick b{font-size:16px;font-weight:800;color:var(--muted)}
.lv-pick span{font-size:11.5px;color:var(--muted);line-height:1.2}
.lv-pick label:has(input:checked){border-color:transparent;background:linear-gradient(135deg,#FFC24D,#F59E0B 55%,#EA580C);box-shadow:0 6px 14px rgba(234,88,12,.3)}
.lv-pick label:has(input:checked) b,.lv-pick label:has(input:checked) span{color:#fff}
.lv-pick label:has(input:focus-visible){outline:3px solid rgba(10,91,216,.35);outline-offset:2px}
@media (max-width:640px){.lv-pick{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

function downloadB64(b64, name, mime) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([bytes], { type: mime }));
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/** Perkecil foto di browser (pangkas persegi 256 px, JPEG) agar ringan dikirim dan disimpan. */
function fotoKecil(file) {
  return new Promise((resolve, reject) => {
    if (!/^image\//.test(file.type)) return reject(new Error('Pilih berkas gambar (JPG atau PNG).'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight, side = Math.min(w, h), N = 256, c = document.createElement('canvas');
      c.width = c.height = N;
      const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';
      g.drawImage(img, (w - side) / 2, (h - side) * (h > w ? 0.25 : 0.5), side, side, 0, 0, N, N);   // foto potret: bidik bagian atas (wajah)
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Foto tidak dapat dibaca. Gunakan JPG atau PNG.')); };
    img.src = url;
  });
}

/* markdown aman untuk balasan chatbot (HTML di-escape lebih dulu) */
function md(src) {
  const blocks = [];
  let h = esc(src).replace(/```([\s\S]*?)```/g, (m, c) => { blocks.push('<pre><code>' + c.trim() + '</code></pre>'); return '\u0000' + (blocks.length - 1) + '\u0000'; });
  const inl = t => t.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  const out = []; let list = null, para = [], tbl = [];
  const flushP = () => { if (para.length) { out.push('<p>' + inl(para.join('<br>')) + '</p>'); para = []; } };
  const flushL = () => { if (list) { out.push('</' + list + '>'); list = null; } };
  const flushT = () => {
    if (!tbl.length) return;
    const rows = tbl.filter(r => !/^\|?\s*:?-{2,}/.test(r)).map(r => r.replace(/^\||\|$/g, '').split('|').map(c => inl(c.trim())));
    out.push('<div class="tbl-wrap"><table class="tbl">' + rows.map((r, i) => '<tr>' + r.map(c => (i ? '<td>' : '<th>') + c + (i ? '</td>' : '</th>')).join('') + '</tr>').join('') + '</table></div>');
    tbl = [];
  };
  h.split('\n').forEach(raw => {
    const l = raw.trimEnd();
    let m;
    if (/^\s*\|.*\|\s*$/.test(l)) { flushP(); flushL(); tbl.push(l.trim()); return; }
    flushT();
    if (!l.trim()) { flushP(); flushL(); return; }
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { flushP(); flushL(); out.push('<h4>' + inl(m[2]) + '</h4>'); return; }
    if ((m = l.match(/^\s*[-*]\s+(.*)$/))) { flushP(); if (list !== 'ul') { flushL(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); return; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))) { flushP(); if (list !== 'ol') { flushL(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inl(m[1]) + '</li>'); return; }
    flushL(); para.push(l);
  });
  flushP(); flushL(); flushT();
  return out.join('').replace(/\u0000(\d+)\u0000/g, (m, i) => blocks[+i]);
}

/**
 * Memasang loader ke elemen host. o: { title, msgs:[[persen,teks]], tau (ms), cap (persen maks sebelum selesai),
 *   late:{ms,text}, hint, doneTitle, doneMsg, hold (ms), compact }.
 * Mengembalikan { stop(), done() }. done() mengisi bar sampai 100% lalu resolve setelah jeda singkat.
 */
function loader(host, o) {
  const nm = sapaNama(), sub = t => String(t).replace(/\{nm\}/g, nm);
  const msgs = o.msgs.map(m => [m[0], sub(m[1])]);
  const bar = '<div class="ld-bar" role="progressbar" aria-label="Perkiraan kemajuan" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i data-l="fill"></i></div>';
  host.innerHTML = o.compact
    ? `<div class="ld ld-c" role="status"><div class="ld-msg" data-l="msg" aria-live="polite"></div>${bar}<b class="ld-pct" data-l="pct">0%</b></div>`
    : `<div class="ld" role="status" aria-label="Sedang memuat"><div class="ld-art"><span class="ld-ring"></span><span class="ld-ring r2"></span><span class="ld-spark s1"></span><span class="ld-spark s2"></span><span class="ld-spark s3"></span>${rbHead('')}</div>
      <div class="ld-title" data-l="title">${esc(sub(o.title || 'Sebentar ya, {nm}'))}</div><div class="ld-msg" data-l="msg" aria-live="polite"></div>${bar}
      <div class="ld-meta"><span>Perkiraan kemajuan</span><b data-l="pct">0%</b></div>${o.hint ? `<div class="ld-hint">${esc(sub(o.hint))}</div>` : ''}</div>`;
  const root = host.firstElementChild, q = k => root.querySelector('[data-l="' + k + '"]');
  const fill = q('fill'), pctEl = q('pct'), msgEl = q('msg'), barEl = root.querySelector('.ld-bar'), titleEl = q('title');
  const t0 = performance.now(), cap = o.cap || 92, tau = o.tau || 1000;
  let pct = 0, idx = -2, lateOn = false, stopped = false, swapT = null;
  const setMsg = (text, instant) => {
    if (instant) { msgEl.textContent = text; return; }
    msgEl.classList.add('swap'); clearTimeout(swapT);
    swapT = setTimeout(() => { msgEl.textContent = text; msgEl.classList.remove('swap'); }, 220);
  };
  const paint = () => {
    const v = Math.min(100, pct), n = Math.floor(v);
    fill.style.width = v + '%'; pctEl.textContent = n + '%'; barEl.setAttribute('aria-valuenow', String(n));
    if (lateOn) return;
    let k = 0; msgs.forEach((m, i) => { if (v >= m[0]) k = i; });
    if (k !== idx) { setMsg(msgs[k][1], idx === -2); idx = k; }
  };
  const tick = () => {
    if (stopped) return;
    const t = performance.now() - t0;
    pct = Math.max(pct, cap * (1 - Math.exp(-t / tau)));
    if (o.late && !lateOn && t > o.late.ms) { lateOn = true; setMsg(sub(o.late.text)); }
    paint();
  };
  const timer = setInterval(tick, 100); tick();
  return {
    stop() { stopped = true; clearInterval(timer); clearTimeout(swapT); },
    done(over) {
      this.stop(); pct = 100; lateOn = true; paint();
      root.classList.add('done');
      over = over || {};
      const dt = over.title || o.doneTitle;
      if (titleEl && dt) titleEl.textContent = sub(dt);
      msgEl.classList.remove('swap'); msgEl.textContent = sub(over.msg || o.doneMsg || 'Selesai!');
      return new Promise(r => setTimeout(r, o.hold == null ? 650 : o.hold));
    }
  };
}
/** Loader halaman: baru tampil bila memuat lebih dari sekejap, supaya halaman cepat tidak berkedip. */
function pageLoader(el, v) {
  let ctl = null, cancelled = false;
  const timer = setTimeout(() => {
    if (cancelled || el.childElementCount > 0) return;           // halaman sudah tampil
    ctl = loader(el, { title: 'Sebentar ya, {nm}', msgs: LD_PAGE[v] || LD_PAGE._, tau: 800, cap: 94 });
  }, 200);
  return { cancel() {
    cancelled = true; clearTimeout(timer);
    if (ctl) { ctl.stop(); ctl = null; if (el.firstElementChild && el.firstElementChild.classList.contains('ld')) el.innerHTML = ''; }
  } };
}

function statusLine(items, libur, showKelas) {
  if (libur) return 'Hari ini libur. Selamat beristirahat.';
  if (!items.length) return 'Belum ada jadwal mengajar hari ini.';
  const n = nowMin(), kls = i => showKelas ? ' (' + i.kelas + ')' : '';
  const on = items.find(i => n >= toMin(i.mulai) && n < toMin(i.selesai));
  if (on) return `Sedang berlangsung: ${on.mapel}${kls(on)}, ${on.mulai} s.d. ${on.selesai}.`;
  const nx = items.find(i => toMin(i.mulai) > n);
  if (nx) { const m = Math.ceil(toMin(nx.mulai) - n); return `Berikutnya: ${nx.mapel}${kls(nx)} pukul ${nx.mulai}, ${m >= 60 ? Math.floor(m / 60) + ' jam ' + (m % 60) + ' menit' : m + ' menit'} lagi.`; }
  return 'Jam mengajar hari ini telah selesai. Terima kasih atas dedikasi Anda.';
}

function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    sc.onload = res; sc.onerror = () => rej(new Error('Pembaca Excel tidak dapat dimuat. Simpan berkas sebagai CSV lalu unggah ulang.'));
    document.head.appendChild(sc);
  });
}
/** Pembaca CSV sederhana: pemisah koma, titik koma, atau tab terdeteksi otomatis; mendukung tanda kutip. */
function parseCSV(text) {
  const first = text.split(/\r?\n/, 1)[0] || '';
  const d = [',', ';', '\t'].map(c => [c, first.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === d) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; rows.push(row); row = []; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
/** Membaca berkas Excel (semua lembar) atau CSV menjadi [{ nama, rows }]. */
async function kurBacaBerkas(file) {
  if (/\.(csv|txt)$/i.test(file.name)) return [{ nama: file.name, rows: parseCSV((await file.text()).replace(/^\uFEFF/, '')) }];
  await loadXlsx();
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  return wb.SheetNames.map(n => ({ nama: n, rows: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '' }) })).filter(t => t.rows.length);
}
function downloadBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

async function kurTemplat() {
  try {
    await loadXlsx();
    const wb = XLSX.utils.book_new(), ws = XLSX.utils.aoa_to_sheet([KUR_HEAD, ...KUR_CONTOH]);
    ws['!cols'] = [8, 10, 20, 8, 16, 50, 30, 8, 60].map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, ws, 'Kurikulum');
    const ps = XLSX.utils.aoa_to_sheet(KUR_PETUNJUK); ps['!cols'] = [{ wch: 110 }];
    XLSX.utils.book_append_sheet(wb, ps, 'Petunjuk');
    downloadBlob(new Blob([XLSX.write(wb, { bookType: 'xlsx', type: 'array' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), 'templat_kurikulum_asdiru.xlsx');
  } catch (e) {                                                  // tanpa pustaka Excel: berikan templat CSV
    const csv = [KUR_HEAD, ...KUR_CONTOH].map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    downloadBlob(new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' }), 'templat_kurikulum_asdiru.csv');

  }));

/** Menyusun Excel format tabel sekolah: satu blok per kelas, baris istirahat otomatis bila ada jeda antar jam. */
function jadwalBuatXlsx(d, kosong) {
  const aoa = [], merges = [], W = 9;
  const mg = (r, c1, c2) => merges.push({ s: { r, c: c1 }, e: { r, c: c2 } });
  const judul = t => { aoa.push([t]); mg(aoa.length - 1, 0, W - 1); };
  judul(String(d.sekolah || '').toUpperCase());
  if (d.alamat) judul(d.alamat);
  aoa.push([]);
  judul('JADWAL PELAJARAN ' + String(d.sekolah || '').toUpperCase());
  judul('TAHUN AJARAN ' + (d.tahunAjaran || ''));
  aoa.push([]);
  d.kelas.forEach(k => {
    let slots;
    if (kosong || !k.items.length) slots = JD_SLOT_BAKU.slice();
    else {
      const uniq = {};
      k.items.forEach(i => { const key = i.mulai + '|' + i.selesai; if (!uniq[key]) uniq[key] = [i.jamKe, i.mulai, i.selesai]; });
      const list = Object.values(uniq).sort((a, b) => a[1] < b[1] ? -1 : 1);
      slots = [];
      list.forEach((sl, i) => { if (i && list[i - 1][2] < sl[1]) slots.push(['', list[i - 1][2], sl[1], 'rehat']); slots.push(sl); });
    }
    aoa.push(['KELAS', 'JAM', 'WAKTU', ...JD_HARI.map(h => h.toUpperCase())]);
    const start = aoa.length;
    slots.forEach((sl, idx) => {
      if (!sl || sl[3] === 'rehat') {
        const prev = slots[idx - 1], next = slots[idx + 1];
        const w = sl ? jdT(sl[1]) + ' - ' + jdT(sl[2]) : (prev && next ? jdT(prev[2]) + ' - ' + jdT(next[1]) : '');
        aoa.push([idx === 0 ? JD_ROMAWI[k.kelas] : '', '', w, 'ISTIRAHAT']); mg(aoa.length - 1, 3, W - 1); return;
      }
      const isi = JD_HARI.map(h => { if (kosong) return ''; const it = k.items.find(i => i.hari === h && i.mulai === sl[1]); return it ? it.mapel : ''; });
      aoa.push([idx === 0 ? JD_ROMAWI[k.kelas] : '', Number(sl[0]) || sl[0], jdT(sl[1]) + ' - ' + jdT(sl[2]), ...isi]);
    });
    if (aoa.length - 1 > start) merges.push({ s: { r: start, c: 0 }, e: { r: aoa.length - 1, c: 0 } });
    aoa.push([]);
  });
  if (d.kepsek) {
    aoa.push([]);
    const tgl = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    [[(d.kota ? d.kota + ', ' : '') + tgl], ['Kepala ' + (d.sekolah || 'Sekolah')], [], [], [], [d.kepsek], ['NIP. ' + (d.kepsekNip || '-')]].forEach(r => aoa.push(['', '', '', '', '', '', ...r]));
  }
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges'] = merges;
  ws['!cols'] = [8, 6, 15, 18, 18, 18, 18, 18, 18].map(w => ({ wch: w }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'JADWAL');
  const pet = [['Petunjuk pengisian jadwal'], ['1. Setiap kelas satu blok, diawali baris judul KELAS | JAM | WAKTU | SENIN ... SABTU. Kelas boleh ditulis I sampai VI atau 1 sampai 6, cukup di baris pertama blok.'],
    ['2. Kolom WAKTU ditulis 07.00 - 07.35. Baris tanpa nomor JAM (misalnya ISTIRAHAT) tidak dianggap jam pelajaran.'],
    ['3. Tulis nama mapel atau kegiatan (Upacara, Literasi, dll.) di kolom hari. Sel kosong berarti tidak ada pelajaran.'],
    ['4. Singkatan umum dibakukan otomatis (Bhs Indonesia menjadi Bahasa Indonesia, Pend. Pancasila menjadi Pendidikan Pancasila) dan dicocokkan dengan nama mapel di data kurikulum.'],
    ['5. Guru pengampu diisi otomatis: guru mapel (misalnya PAI, PJOK) bila mengampu kelas itu, selain itu wali kelas.'],
    ['6. Jadwal kelas yang ada di berkas mengganti seluruh jadwal lama kelas tersebut. Kelas yang tidak ada di berkas tidak berubah.']];
  const wp = XLSX.utils.aoa_to_sheet(pet); wp['!cols'] = [{ wch: 130 }];
  XLSX.utils.book_append_sheet(wb, wp, 'Petunjuk');
  return new Blob([XLSX.write(wb, { bookType: 'xlsx', type: 'array' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
function bindJadwal(el, onSelesai) {
  const q = s => $(s, el);
  if (!q('#jdCard')) return;
  let tables = null, fileName = '';
  const unduh = async kosong => {
    const d = await api('getJadwalUnduh', S.token);
    try { await loadXlsx(); } catch (e) { throw new Error('Pustaka Excel gagal dimuat. Periksa koneksi internet lalu coba lagi.'); }
    if (!kosong && !d.kelas.some(k => k.items.length)) toast('Belum ada jadwal tersimpan; berkas berisi tabel kosong.', 'info');
    downloadBlob(jadwalBuatXlsx(d, kosong), (kosong ? 'templat_jadwal_' : 'jadwal_pelajaran_') + String(d.tahunAjaran || '').replace('/', '-') + '.xlsx');
  };
  q('#jdData').addEventListener('click', e => busy(e.currentTarget, () => unduh(false).catch(err => toast(err.message, 'bad'))));
  if (q('#jdTpl')) q('#jdTpl').addEventListener('click', e => busy(e.currentTarget, () => unduh(true).catch(err => toast(err.message, 'bad'))));
  if (!q('#jdFile')) return;
  const preview = r => {
    const ada = r.total > 0;
    q('#jdPrev').innerHTML = `<div class="kfile">Berkas: <b>${esc(fileName)}</b></div>
      <div class="kstats"><div class="g"><b>${r.perKelas.length}</b><span>kelas</span></div><div><b>${r.total}</b><span>jam pelajaran</span></div><div class="o"><b>${r.dilewati}</b><span>dilewati</span></div></div>
      ${r.perKelas.map(k => `<div class="jd-kls"><b>${esc(k.kelas)}</b><span class="muted small">${k.jam} jam, ${k.hari} hari</span><div class="kchips">${k.mapel.map(m => `<span class="kchip">${esc(m.nama)} <i>${m.jp}</i></span>`).join('')}</div></div>`).join('')}
      ${r.warn.length ? `<ul class="kwarn">${r.warn.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
      ${ada ? `<p class="hint">Jadwal lama ${esc(r.perKelas.map(k => k.kelas).join(', '))} akan diganti dengan isi berkas ini.</p>` : '<div class="err" role="alert" style="margin-top:10px">Tidak ada jadwal yang terbaca. Pastikan ada baris judul KELAS | JAM | WAKTU | SENIN ... SABTU, atau gunakan templat.</div>'}`;
    q('#jdAct').hidden = !ada;
  };
  const check = async file => {
    const host = q('#jdPrev'); q('#jdAct').hidden = true;
    const ld = loader(host, { compact: true, msgs: [[0, 'Membuka berkas jadwal...'], [40, 'Membaca jam dan mata pelajaran...'], [75, 'Mencocokkan guru pengampu...']], tau: 2500, cap: 90 });
    try {
      tables = await kurBacaBerkas(file); if (!tables.length) throw new Error('Berkas tidak berisi data.');
      const r = await api('importJadwal', S.token, { tables, dryRun: true });
      ld.stop(); if (document.body.contains(host)) preview(r);
    } catch (err) { ld.stop(); tables = null; if (document.body.contains(host)) host.innerHTML = `<div class="err" role="alert">${esc(err.message)}</div>`; }
  };
  const pick = file => { if (!file) return; if (file.size > 8 * 1024 * 1024) { toast('Ukuran berkas terlalu besar (maksimal 8 MB).', 'bad'); return; } fileName = file.name; check(file); };
  q('#jdFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; pick(f); });
  const drop = q('#jdDrop');
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => pick(e.dataTransfer && e.dataTransfer.files[0]));
  q('#jdGo').addEventListener('click', e => busy(e.currentTarget, async () => {
    if (!tables) return;
    const host = q('#jdPrev'); q('#jdAct').hidden = true;
    const ld = loader(host, { compact: true, msgs: [[0, 'Menyimpan jadwal pelajaran...'], [60, 'Merapikan Master_Jadwal...']], tau: 3000, cap: 92, doneMsg: 'Jadwal pelajaran tersimpan.', hold: 500 });
    try {
      const r = await api('importJadwal', S.token, { tables, dryRun: false });
      await ld.done(); tables = null;
      toast(`Jadwal tersimpan: ${r.total} jam pelajaran untuk ${r.perKelas.length} kelas.`, 'ok');
      host.innerHTML = ''; if (onSelesai) onSelesai();
    } catch (err) { ld.stop(); host.innerHTML = `<div class="err" role="alert">${esc(err.message)}</div>`; q('#jdAct').hidden = false; }
  }));
}

/* =============== KOP DOKUMEN WORD (gambar) =============== */
/** Mencari kotak isi non-putih pada data piksel RGBA; dipakai untuk memangkas ruang putih di tepi gambar kop. */
function kopTrimBox(d, w, h) {
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if (d[i + 3] > 20 && (d[i] < 245 || d[i + 1] < 245 || d[i + 2] < 245)) {
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
  }
  return x1 < 0 ? null : { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
}
/** Menyiapkan gambar kop: latar putih, pangkas ruang kosong, perkecil maksimal 1500 px lebar, simpan sebagai PNG (JPG bila terlalu besar). */
function kopSiapkan(file) {
  return new Promise((resolve, reject) => {
    if (!/^image\/(png|jpeg)$/.test(file.type)) return reject(new Error('Gunakan gambar PNG atau JPG.'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const W = img.naturalWidth, H = img.naturalHeight;
        if (W < 600) throw new Error('Gambar terlalu kecil. Gunakan lebar minimal 1.200 piksel agar tajam saat dicetak.');
        const c = document.createElement('canvas'); c.width = W; c.height = H;
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.drawImage(img, 0, 0);
        const bb = kopTrimBox(g.getImageData(0, 0, W, H).data, W, H);
        if (!bb) throw new Error('Gambar tampak kosong.');
        const pad = 10, sx = Math.max(0, bb.x - pad), sy = Math.max(0, bb.y - pad), sw = Math.min(W - sx, bb.w + 2 * pad), sh = Math.min(H - sy, bb.h + 2 * pad);
        const sc = Math.min(1, 1500 / sw), ow = Math.round(sw * sc), oh = Math.round(sh * sc);
        const o = document.createElement('canvas'); o.width = ow; o.height = oh;
        const og = o.getContext('2d'); og.fillStyle = '#fff'; og.fillRect(0, 0, ow, oh); og.imageSmoothingQuality = 'high'; og.drawImage(c, sx, sy, sw, sh, 0, 0, ow, oh);
        let out = o.toDataURL('image/png'); if (out.length > 520000) out = o.toDataURL('image/jpeg', 0.9);
        URL.revokeObjectURL(url); resolve({ dataUrl: out, w: ow, h: oh });
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Gambar tidak dapat dibaca. Gunakan PNG atau JPG.')); };
    img.src = url;
  });
}

function soalCard(s, i) {

function collectData() {
  const jenis = S.gen.result.jenis, d = { judul: $('#eJudul').value };
  const pipe = (id, keys) => lines($('#' + id).value).map(l => { const c = l.split('|').map(x => x.trim()); const o = {}; keys.forEach((k, i) => o[k] = c[i] || ''); return o; });
  if (jenis === 'modul') {
    Object.keys(FIELD_LABEL).forEach(k => d[k] = lines($('#e_' + k).value));
    d.rubrik = pipe('e_rubrik', ['aspek', 'perlu_bimbingan', 'cukup', 'baik', 'sangat_baik']);
  } else {
    d.kisi_kisi = pipe('e_kisi', S.gen.kisiTp ? ['tp', 'indikator', 'level', 'bentuk', 'nomor'] : ['indikator', 'level', 'bentuk', 'nomor']);
    d.soal = $$('#soalList .soal-card').map((c, i) => ({ nomor: i + 1, bentuk: $('.s-bentuk', c).value, pertanyaan: $('.s-tanya', c).value, opsi: lines($('.s-opsi', c).value), kunci: $('.s-kunci', c).value, skor: +$('.s-skor', c).value || 1, pembahasan: $('.s-bahas', c).value }));
    d.pedoman_penskoran = lines($('#e_skor').value);
  }
  return d;
}
async function saveDoc() {
  const g = S.gen, r = g.result;
  const payload = Object.assign({ jenis: r.jenis, kelas: g.params.kelas, mapel: g.params.mapel, idTp: g.params.idTp }, g.params.idTps ? { idTps: g.params.idTps } : {}, r.meta, { data: collectData() });
  const info = $('#saveInfo');
  const ld = loader(info, { compact: true, msgs: LD_SAVE, tau: 6000, cap: 92, doneMsg: 'Berhasil. Mengunduh dokumen...', hold: 450 });
  try {
    const out = await api('simpanModulKeDriveWord', S.token, payload);
    await ld.done();
    downloadB64(out.base64, out.filename, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
    $('#saveInfo').innerHTML = `Tersimpan di Drive. <a href="${esc(out.driveUrl)}" target="_blank" rel="noopener">Buka file</a>`;
    toast('Dokumen tersimpan dan diunduh.', 'ok');
    loadArsip();
  } catch (err) { ld.stop(); if (document.body.contains(info)) info.textContent = ''; toast(err.message, 'bad'); }
}

/** Klik pertama meminta konfirmasi (tombol berubah), klik kedua dalam 6 detik menjalankan aksi. Tanpa dialog browser. */
function klikKonfirmasi(btn, labelKonfirmasi, fn) {
  let t = null, asli = btn.innerHTML;
  btn.addEventListener('click', () => {
    if (btn.dataset.armed === '1') { clearTimeout(t); btn.dataset.armed = '0'; btn.innerHTML = asli; busy(btn, fn); return; }
    btn.dataset.armed = '1'; asli = btn.innerHTML; btn.innerHTML = esc(typeof labelKonfirmasi === 'function' ? labelKonfirmasi() : labelKonfirmasi);
    t = setTimeout(() => { btn.dataset.armed = '0'; btn.innerHTML = asli; }, 6000);
  });
}
