    <div class="field" style="margin-top:14px"><label class="kop-chk"><input type="checkbox" id="nkTa"> Sekaligus ubah tahun ajaran menjadi</label>
      <input id="nkTaIn" type="text" inputmode="numeric" maxlength="9" value="${esc(n.tahunAjaranBerikut)}" style="max-width:180px" disabled aria-label="Tahun ajaran baru"><span class="hint">Centang hanya saat kenaikan akhir tahun ajaran, dan cukup satu orang (mis. Super Admin) yang melakukannya.</span></div>
    <div class="savebar" style="justify-content:flex-start"><button class="btn warn" id="nkGo" type="button" ${n.siswa.length ? '' : 'disabled'}>Naikkan siswa terpilih</button></div></section>
  ${isSuper ? `<section class="card"><div class="card-head"><h2>Naikkan semua kelas sekaligus</h2></div>
    <p class="muted small" style="margin-bottom:10px">Kelas 6 diluluskan, Kelas 5 naik ke Kelas 6, dan seterusnya, dikerjakan berurutan dari kelas tertinggi. Siswa yang tinggal kelas dapat dikembalikan manual lewat Panel admin (ubah kelasnya di Spreadsheet). Siswa aktif saat ini: ${n.semua.map(x => esc(x.kelas.replace('Kelas ', 'K')) + ' ' + x.jumlah).join(' · ')}.</p>
    <div class="field"><label class="kop-chk"><input type="checkbox" id="akTa" checked> Sekaligus ubah tahun ajaran menjadi</label>
      <input id="akTaIn" type="text" inputmode="numeric" maxlength="9" value="${esc(n.tahunAjaranBerikut)}" style="max-width:180px" aria-label="Tahun ajaran baru"></div>
    <div class="savebar" style="justify-content:flex-start"><button class="btn warn" id="akGo" type="button">Naikkan semua kelas</button></div></section>` : ''}`;
  const reload = () => V.siswa(el);
  const gagal = err => toast(err.message, 'bad');
  $('#taSave').addEventListener('click', e => busy(e.currentTarget, async () => {
    try { const r = await api('aturTahunAjaran', S.token, $('#taIn').value); S.sekolah = r.sekolah; toast('Tahun ajaran diperbarui.', 'ok'); reload(); } catch (err) { gagal(err); }
  }));
  bindJadwal(el, () => { if (S.user.role !== 'kepala_sekolah') toast('Jadwal di Beranda ikut diperbarui.', 'info'); });
  if (isGuru) bindDaftar(el, true, () => { toast('Daftar siswa kelas diperbarui.', 'ok'); reload(); });
  $('#nkKelas').addEventListener('change', e => { S.nk = e.target.value; reload(); });
  const warn = () => {
    const t = $('#nkTuju').value, j = jmlT(t);
    $('#nkWarn').innerHTML = t !== 'Lulus' && j ? `<div class="int-note" role="note" style="margin-top:10px"><b>${esc(t)} masih berisi ${j} siswa aktif</b>Naikkan atau luluskan ${esc(t)} lebih dulu agar siswa tidak bercampur. Bila memang digabung, abaikan peringatan ini.</div>` : '';
  };
  $('#nkTuju').addEventListener('change', warn); warn();
  if ($('#nkAll')) { $('#nkAll').addEventListener('click', () => $$('#nkList input').forEach(c => { c.checked = true; })); $('#nkNone').addEventListener('click', () => $$('#nkList input').forEach(c => { c.checked = false; })); }
  $('#nkTa').addEventListener('change', e => { $('#nkTaIn').disabled = !e.target.checked; });
  const terpilih = () => $$('#nkList input:checked').map(c => c.value);
  klikKonfirmasi($('#nkGo'), () => 'Klik lagi untuk memindahkan ' + terpilih().length + ' siswa ke ' + $('#nkTuju').value, async () => {
    try {
      const ids = terpilih();
      if (!ids.length) throw new Error('Pilih minimal satu siswa untuk dinaikkan.');
      const r = await api('naikkanSiswa', S.token, { kelas: $('#nkKelas').value, tujuan: $('#nkTuju').value, ids: ids, tahunAjaranBaru: $('#nkTa').checked ? $('#nkTaIn').value : '' });
      S.sekolah = r.sekolah;
      toast(r.ke === 'Lulus' ? r.dipindah + ' siswa diluluskan.' : r.dipindah + ' siswa naik ke ' + r.ke + '.', 'ok'); S.nk = ''; reload();
    } catch (err) { gagal(err); }
  });
  if (isSuper) klikKonfirmasi($('#akGo'), 'Klik lagi untuk menaikkan SEMUA kelas', async () => {
    try {
      const r = await api('naikkanSemuaKelas', S.token, { tahunAjaranBaru: $('#akTa').checked ? $('#akTaIn').value : '' });
      S.sekolah = r.sekolah; const tot = r.rincian.reduce((a, x) => a + x.jumlah, 0);
      toast(tot + ' siswa dipindahkan' + ($('#akTa').checked ? '; tahun ajaran ' + r.sekolah.tahunAjaran + '.' : '.'), 'ok'); S.nk = ''; reload();
    } catch (err) { gagal(err); }
  });
};

/* =============== KEPALA SEKOLAH =============== */
async function kepData(force) {
  if (!force && S.kep && S.kep.periode === S.kepPeriode && Date.now() - S.kepAt < 60000) return S.kep;
  S.kep = await api('getMonitoringKepsek', S.token, S.kepPeriode); S.kepAt = Date.now(); setClock(S.kep.jadwal.nowMin, S.kep.jadwal.nowSec);
  return S.kep;
}
function loadChart() {
  if (window.Chart) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js'; s.onload = () => { window.asdiruTema && window.asdiruTema(); res(); }; s.onerror = () => rej(new Error('Grafik tidak dapat dimuat. Periksa koneksi internet.')); document.head.appendChild(s); });
}
V.kpresensi = async function (el) {
  const [d] = await Promise.all([kepData(), loadChart().catch(() => null)]);
  const t = d.hariIni, tp = d.periodeTotal;
  const ratio = (o, tot) => ['H', 'S', 'I', 'A'].map(k => `<i class="c-${k}" style="width:${tot ? o[k] / tot * 100 : 0}%" title="${k}: ${o[k]}"></i>`).join('');
  el.innerHTML = head('Presensi sekolah', d.label) + `
  <div class="tabs" role="tablist">${['harian', 'mingguan', 'bulanan'].map(p => `<button role="tab" data-p="${p}" aria-selected="${S.kepPeriode === p}">${p[0].toUpperCase() + p.slice(1)}</button>`).join('')}</div>
  <section class="card"><div class="card-head"><h2>Kehadiran hari ini</h2><span class="badge">${t.total} catatan</span></div>
    ${t.total ? `<div class="ratio">${ratio(t, t.total)}</div><div class="facts">${['H', 'S', 'I', 'A'].map(k => `<div class="c-${k}"><b>${t[k]}</b>${{ H: 'Hadir', S: 'Sakit', I: 'Izin', A: 'Alpa' }[k]}</div>`).join('')}</div>` : '<div class="empty"><b>Belum ada presensi hari ini</b>Data muncul setelah guru menyimpan presensi.</div>'}</section>
  ${trenCardHTML('Tren kehadiran siswa', '<label class="sr" for="trKelas">Kelas</label><select data-r="kelas" id="trKelas" style="width:auto"><option value="Semua">Semua kelas</option>' + ['Kelas 1', 'Kelas 2', 'Kelas 3', 'Kelas 4', 'Kelas 5', 'Kelas 6'].map(k => `<option>${k}</option>`).join('') + '</select>')}
  <section class="card" style="margin-top:18px"><div class="card-head"><h2>Persentase hadir per kelas</h2><span class="badge info">${tp.persen == null ? 'Belum ada data' : 'Rata-rata ' + fmtPct(tp.persen)}</span></div><div class="chart-box"><canvas id="chKelas" role="img" aria-label="Grafik batang persentase kehadiran per kelas"></canvas></div></section>`;
  trenInit($('[data-tren]', el), () => $('[data-r="kelas"]', el).value);
  $$('.tabs button', el).forEach(b => b.addEventListener('click', () => { S.kepPeriode = b.dataset.p; S.kep = null; go('kpresensi'); }));
  if (!window.Chart) { $$('.chart-box').forEach(c => c.innerHTML = '<div class="empty">Grafik tidak dapat dimuat.</div>'); return; }
  Chart.defaults.font.family = "'Plus Jakarta Sans',sans-serif";
  new Chart($('#chKelas'), { type: 'bar', data: { labels: d.perKelas.map(k => k.kelas), datasets: [{ label: '% hadir', data: d.perKelas.map(k => k.persen), backgroundColor: '#0A5BD8', borderRadius: 8 }] }, options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100, ticks: { callback: v => v + '%' } } } } });
};
V.kjadwal = async function (el) {
  const d = await kepData(), j = d.jadwal;
  const kelas = ['Semua', 'Kelas 1', 'Kelas 2', 'Kelas 3', 'Kelas 4', 'Kelas 5', 'Kelas 6'];
  const items = () => S.kepKelas === 'Semua' ? j.items : j.items.filter(i => i.kelas === S.kepKelas);
  el.innerHTML = head('Jadwal pelajaran hari ini', '', `<span class="badge ok">${esc(j.tanggalLabel)}</span>`) + `
  <div class="tabs" role="tablist">${kelas.map(k => `<button role="tab" data-k="${k}" aria-selected="${S.kepKelas === k}">${k}</button>`).join('')}</div>
  <div id="kSched">${j.libur ? '<div class="card empty"><b>Hari libur</b>Tidak ada pelajaran pada hari Minggu.</div>' : renderSchedule(items(), S.kepKelas === 'Semua')}</div>`;
  $$('.tabs button', el).forEach(b => b.addEventListener('click', () => { S.kepKelas = b.dataset.k; V.kjadwal(el); }));
  if (!j.libur) tickSchedule($('#kSched'), items, S.kepKelas === 'Semua');
};
V.kdokumen = async function (el) {
  const d = await kepData(true);
  el.innerHTML = head('Dokumen pembelajaran guru', 'Pantau modul ajar dan asesmen yang sudah dibuat. Hanya untuk dilihat.') +
    `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nama guru</th><th>Kelas ampu</th><th class="n">Modul ajar</th><th class="n">Asesmen</th><th>Berkas</th></tr></thead><tbody>${d.dokumen.map(g => `<tr><td>${esc(g.nama)}</td><td>${esc(g.kelas || '-')}</td><td class="n">${g.totalModul}</td><td class="n">${g.totalAsesmen}</td><td>${g.files.length ? `<details class="files"><summary>Buka file (${g.files.length})</summary><ul>${g.files.map(f => `<li>${esc(f.jenis)}, ${esc(f.mapel)} ${esc(f.kelas)}, ${esc(f.waktu.slice(0, 10))}: <a href="${esc(f.url)}" target="_blank" rel="noopener">Buka</a></li>`).join('')}</ul></details>` : '<span class="muted">Belum ada</span>'}</td></tr>`).join('')}</tbody></table></div>`;
};

/* =============== inisialisasi =============== */
/* Sapaan halaman masuk mengikuti waktu setempat. */
(function () {
  const h = new Date().getHours(), el = document.getElementById('loginHi');
  if (el) el.textContent = 'Selamat ' + (h < 11 ? 'pagi' : h < 15 ? 'siang' : h < 18 ? 'sore' : 'malam') + ', Bapak/Ibu Guru Hebat!';
})();
/* Efek mengetik pada slogan halaman masuk: mengetik, diam beberapa detik, menghapus cepat, lalu mengetik lagi. */
(function () {
  const el = document.getElementById('twLive'); if (!el) return;
  const full = el.textContent, login = document.getElementById('login');
  const diam = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (diam) return;                                            // pengguna meminta gerakan dikurangi: teks tampil utuh
  let n = 0, arah = 1;
  const tampil = () => !login.hidden && !document.hidden;
  const jalan = () => {
    if (!tampil()) { setTimeout(jalan, 600); return; }          // jeda saat halaman masuk tidak terlihat
    n += arah; el.textContent = full.slice(0, n);
    if (arah === 1 && n >= full.length) { arah = -1; setTimeout(jalan, 4500); return; }   // diam setelah selesai mengetik
    if (arah === -1 && n <= 0) { arah = 1; setTimeout(jalan, 700); return; }
    setTimeout(jalan, arah === 1 ? 55 + Math.random() * 45 : 14);
  };
  el.textContent = ''; setTimeout(jalan, 900);
})();
$('#pwToggle').addEventListener('click', e => {
  const b = e.currentTarget, i = $('#lPass'), show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  b.setAttribute('aria-pressed', String(show)); b.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
  b.querySelector('.eye-on').toggleAttribute('hidden', show); b.querySelector('.eye-off').toggleAttribute('hidden', !show);   // SVG tidak punya properti .hidden
});
$('#loginForm').addEventListener('submit', e => {
  e.preventDefault();
  busy($('#loginBtn'), async () => {
    $('#loginErr').hidden = true;
    try {
      const d = await api('login', $('#lEmail').value, $('#lPass').value);
      S.token = d.token; sessionStorage.setItem('asdiru_token', d.token);
      startApp(d);
    } catch (err) { const b = $('#loginErr'); b.hidden = false; b.textContent = err.message; $('#lPass').value = ''; $('#lPass').focus(); }
  });
});
$('#logoutBtn').addEventListener('click', doLogout);
$('#logoutBtn2').addEventListener('click', doLogout);
(async function init() {
  $('#loginLogo').src = LOGO.full; { const la = $('#logoAnim'); la.addEventListener('click', () => { la.classList.remove('hi'); void la.offsetWidth; la.classList.add('hi'); }); la.addEventListener('animationend', e => { if (e.animationName === 'lgWave') la.classList.remove('hi'); }); } $('#sideLogo').src = LOGO.mark; $('#topLogo').src = LOGO.mark;
  const t = sessionStorage.getItem('asdiru_token');
  if (!t) { showLogin(); return; }
  S.token = t;
  try { const d = await api('validasiSesi', t); startApp(Object.assign({ token: t }, d)); }
  catch (e) { S.token = null; sessionStorage.removeItem('asdiru_token'); showLogin(); }
})();

/* ---------- tema gelap / terang ---------- */
(function () {
  const root = document.documentElement;
  const cur = () => root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  function paint() {
    const gelap = cur() === 'dark';
    document.querySelectorAll('[data-theme-toggle]').forEach(b => {
      b.setAttribute('aria-label', gelap ? 'Ganti ke tema terang' : 'Ganti ke tema gelap');
      b.setAttribute('title', gelap ? 'Tema terang' : 'Tema gelap');
      b.setAttribute('aria-pressed', gelap ? 'true' : 'false');
    });
    const m = document.querySelector('meta[name=theme-color]') || Object.assign(document.head.appendChild(document.createElement('meta')), { name: 'theme-color' });
    m.content = gelap ? '#0A1020' : '#D9E4FB';
    if (window.Chart) { Chart.defaults.color = gelap ? '#9AA8CC' : '#5D6A91'; Chart.defaults.borderColor = gelap ? 'rgba(255,255,255,.1)' : 'rgba(0,0,0,.1)'; }
  }
  window.asdiruTema = paint;
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-theme-toggle]'); if (!b) return;
    const t = cur() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', t);
    try { localStorage.setItem('asdiru_tema', t); } catch (x) {}
    paint();
  });
  try {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    mq.addEventListener && mq.addEventListener('change', ev => {
      let saved = null; try { saved = localStorage.getItem('asdiru_tema'); } catch (x) {}
      if (saved) return;
      root.setAttribute('data-theme', ev.matches ? 'dark' : 'light'); paint();
    });
  } catch (x) {}
  paint();
})();
</script>
